services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eclinic-backend
    ports:
      - "10000:10000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    restart: always
    command: npm run start:prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eclinic-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_BACKEND_BASE_URL=${NEXT_PUBLIC_BACKEND_BASE_URL}
      - NEXT_GOOGLE_API_KEY=${NEXT_GOOGLE_API_KEY}
      - NEXT_GOOGLE_EMAIL=${NEXT_GOOGLE_EMAIL}
      - NEXT_GOOGLE_EMAIL_PASSWORD=${NEXT_GOOGLE_EMAIL_PASSWORD}
    depends_on:
      - backend
    restart: always
    command: npm run start

  db:
    image: postgres:16
    container_name: eclinic-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:

