name: Add labels and Move Task

on:
  pull_request:
    types: [closed]

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Move to Done section and Label Task (ticket)
        working-directory: ./scripts
        run: |
          python3 pm_tools.py finish "${{ github.event.pull_request.title }}"
          python3 pm_tools.py label "${{ github.event.pull_request.title }}" merged_on_github
