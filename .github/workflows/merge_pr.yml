name: Add labels and Move Task

on:
  pull_request:
    types: [closed]   # Runs when the PR is closed (merged or manually closed)

jobs:
  on-merge:
    if: github.event.pull_request.merged == true   # Run only if it was actually merged
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show branch info
        run: |
          echo "✅ Pull Request was merged!"
          echo "Source branch: ${{ github.event.pull_request.head.ref }}"
          echo "Target branch: ${{ github.event.pull_request.base.ref }}"
          echo "Merged by: ${{ github.event.pull_request.merged_by.login }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
